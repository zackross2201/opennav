name: Weekly Map Builder & Release

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Planetiler & Build MapLibre MBTiles
        run: |
          mkdir -p output
          
          # 1. Download Planetiler jar
          wget -q https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

          # 2. Download fresh Geofabrik raw extract for England (~900MB - unthrottled gigabit speeds)
          wget -q -O england-latest.osm.pbf https://download.geofabrik.de/europe/great-britain/england-latest.osm.pbf

          # 3. Build native vector tiles with --download enabled for required shapefiles
          java -Xmx5g -jar planetiler.jar --download --osm-path=england-latest.osm.pbf --output=output/England.mbtiles

          ls -lh output/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Weekly Map Update"
          draft: false
          prerelease: false
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
