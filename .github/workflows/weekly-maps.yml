name: Weekly Map Builder & Release

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Real Vector Maps
        run: |
          mkdir -p output
          # Direct downloads from the verified Mapsforge UK directory
          curl -fL -A "Mozilla/5.0" -o output/England.map "https://download.mapsforge.org/maps/v5/europe/united-kingdom/england.map"
          curl -fL -A "Mozilla/5.0" -o output/Scotland.map "https://download.mapsforge.org/maps/v5/europe/united-kingdom/scotland.map"
          curl -fL -A "Mozilla/5.0" -o output/Wales.map "https://download.mapsforge.org/maps/v5/europe/united-kingdom/wales.map"

          # Verify downloads are valid binary maps
          ls -lh output/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Weekly Map Update"
          draft: false
          prerelease: false
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
