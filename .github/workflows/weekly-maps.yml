name: Weekly Map Builder & Release

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Real Vector Maps
        run: |
          mkdir -p output
          # Download actual Mapsforge binary vector maps from the official fast mirror
          curl -fL -A "Mozilla/5.0" -o output/England.map "https://ftp-stud.hs-esslingen.de/pub/Mirrors/download.mapsforge.org/maps/v5/europe/great_britain/england.map"
          curl -fL -A "Mozilla/5.0" -o output/Scotland.map "https://ftp-stud.hs-esslingen.de/pub/Mirrors/download.mapsforge.org/maps/v5/europe/great_britain/scotland.map"

          # Verify file sizes are real (> 100MB)
          ls -lh output/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Weekly Map Update"
          draft: false
          prerelease: false
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
