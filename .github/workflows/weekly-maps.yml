name: Weekly Map Builder & Release

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build MapLibre MBTiles with Planetiler
        run: |
          mkdir -p output data/sources
          
          # Download Planetiler release
          wget -q https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

          # Pre-download shapefiles with curl to avoid Java header-buffer timeouts
          curl -fL -A "Mozilla/5.0" -o data/sources/lake_centerline.shp.zip "https://github.com/acalcutt/osm-lakelines/releases/download/latest/lake_centerline.shp.zip"
          curl -fL -A "Mozilla/5.0" -o data/sources/water-polygons-split-3857.zip "https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip"
          curl -fL -A "Mozilla/5.0" -o data/sources/natural_earth_vector.sqlite.zip "https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip"

          # Build England (Planetiler pulls fresh Geofabrik data automatically)
          java -Xmx5g -jar planetiler.jar --download --area=england --output=output/England.mbtiles --fetch-wikidata=false

          # Build Scotland
          java -Xmx5g -jar planetiler.jar --download --area=scotland --output=output/Scotland.mbtiles --fetch-wikidata=false

          ls -lh output/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Weekly Map Update"
          draft: false
          prerelease: false
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
