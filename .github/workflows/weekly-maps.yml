name: Weekly Map Builder & Release

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch MapLibre Vector MBTiles
        run: |
          mkdir -p output
          
          # Direct downloads of vector tile archives from OpenFreeMap/Protomaps fast mirror
          curl -fL -A "Mozilla/5.0" -o output/England.mbtiles "https://r2-tiles.openfreemap.org/mbtiles/england.mbtiles" || \
          curl -fL -A "Mozilla/5.0" -o output/England.mbtiles "https://pub-c2a4f4e7c7a346519102436d8d675688.r2.dev/england.mbtiles"

          ls -lh output/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Weekly Map Update"
          draft: false
          prerelease: false
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
